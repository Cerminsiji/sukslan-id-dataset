name: Update Indonesian Sample Dataset

permissions:
  contents: write

concurrency:
  group: sukslan-id-dataset
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 1 * * *"   # 08.00 WIB tiap hari
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # 1️⃣ Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2️⃣ Detect branch
      - name: Detect Branch
        run: echo "BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV

      # 3️⃣ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 4️⃣ Jalankan generator sample
      - name: Generate Dataset Samples
        run: node generate_samples.js

      # 5️⃣ Commit & Push
      - name: Commit and Push Changes
        run: |
          git config user.name "Sukslan Dataset Bot"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git add .
          git commit -m "auto update indonesia dataset samples" || echo "no changes"

          git pull --rebase origin $BRANCH || true
          git push origin $BRANCH --force-with-lease
          
